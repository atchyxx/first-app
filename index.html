<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横スクロールアクション</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <div id="ui">
      <span class="hud-item">🏆 <strong id="score">0</strong></span>
      <span class="hud-item">LIFE <strong id="lives">3</strong></span>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="overlay" class="hidden">
    <h1 id="overlayTitle">ゲームオーバー</h1>
    <p id="overlayScore"></p>
    <button id="restartBtn">リトライ</button>
  </div>
  <div id="controls">← → / A D: 移動 &nbsp;|&nbsp; ↑ / W / Space: ジャンプ</div>
  <script src="game.js"></script>
</body>
</html>
